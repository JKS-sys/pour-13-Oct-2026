name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build every platform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin,x86_64-unknown-linux-musl,aarch64-unknown-linux-musl,i686-unknown-linux-musl,x86_64-pc-windows-gnu,aarch64-pc-windows-gnullvm,x86_64-unknown-freebsd
      - uses: Swatinem/rust-cache@v2
      - run: pip3 install ziglang && cargo install cargo-zigbuild
      - name: Build and package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$VERSION" = "$GITHUB_REF_NAME" ] && VERSION=$(sed -n 's/^version = "\([0-9.]*\)"/\1/p' Cargo.toml | head -1)
          bash update.sh --no-publish --skip-tests --version "$VERSION" --only build
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  freebsd:
    name: FreeBSD smoke test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          run: |
            chmod +x dist/pour-freebsd-x86_64
            dist/pour-freebsd-x86_64 --version
            POUR_PREFIX=/tmp/pour dist/pour-freebsd-x86_64 env || true

  publish:
    name: publish
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(python3 -c 'import json;print(json.load(open("dist/latest.json"))["notes"])')
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "Pour $VERSION" --notes "$NOTES" --latest
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Mirror to Cloudflare R2
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for f in dist/*; do
            ct=application/octet-stream; case "$f" in *.json) ct=application/json;; *.sh) ct=text/plain;; esac
            for try in 1 2 3; do npx --yes wrangler@4 r2 object put "pour-registry/releases/$(basename "$f")" --file "$f" --content-type "$ct" --remote && break; sleep $((try*5)); done
          done
