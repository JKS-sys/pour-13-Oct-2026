[workspace]
resolver = "2"
members = ["crates/pour-core", "crates/pour"]

[workspace.package]
version = "0.1.6"
edition = "2021"
rust-version = "1.86"
license-file = "LICENSE"
authors = ["Jagadeesh Kumar S <JKS.sys@icloud.com>"]
repository = "https://github.com/JKS-sys/pour-13-Oct-2026"
homepage = "https://ipconfig.co.network/pour"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }
ureq = { version = "2", default-features = false, features = ["tls", "gzip", "json", "proxy-from-env"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
webpki-roots = "0.26"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
tar = "0.4"
sha2 = "0.10"
rayon = "1"
memchr = "2"
memmap2 = "0.9"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
indicatif = "0.17"
console = "0.15"
thiserror = "2"
libc = "0.2"
regex-lite = "0.1"
glob = "0.3"
hex = "0.4"
tempfile = "3"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
